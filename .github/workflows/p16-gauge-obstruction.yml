name: P16 source-matched idle gauge screening
on:
  push:
    branches:
      - research/p16-cross-domain-lifting-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gauge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/p16-joint-lab
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify pinned PR4470 skeleton and nonfree idle gauge obligations
        run: python -I -B research/p16-joint-lab/idle_gauge_obstruction.py
      - name: Verify published P16 exact rational selected baseline
        run: python -I -B research/p16-joint-lab/frontier_rational_gate.py
