name: P16 exact rational source-pinned moment gate
on:
  push:
    branches:
      - research/p16-joint-optimization-lab-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/p16-joint-lab
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run exact 10928-target 64620-paid rational P16 gate
        run: python -I -B research/p16-joint-lab/frontier_rational_gate.py
