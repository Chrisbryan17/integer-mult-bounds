name: P16 exact 0.00302017 target barrier and rank-exchange screen
on:
  push:
    branches:
      - research/p16-k00302017-rank-exchange-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/p16-k00302017-rank-exchange
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Recompute exact rational deficit and hypothetical rank-exchange moment
        run: python -I -B research/p16-k00302017-rank-exchange/rank_exchange_screen.py
      - name: Prove strict no-go for single-helper terminal enlargement
        run: python -I -B research/p16-k00302017-rank-exchange/terminal_extension_no_go.py
