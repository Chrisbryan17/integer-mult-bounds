name: P104 in-place source and typed integer channel
on:
  push:
    branches:
      - research/p104-source-unimodular-inplace-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-rank-native-integer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/p104-exact-clifford-factor-pass
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact Gaussian matrix acceleration
        run: python -m pip install 'numpy>=2.2,<3'
      - name: Regenerate source signed word and E8 physically correct labels
        working-directory: research/p104-exact-clifford-factor-pass
        run: |
          python -I -B p104_native_e8_gate/scripts/native_chart_emitter.py
          python -I -B p104_dirty_zero_adapter.py
          python -I -B p104_physical_e8_isometry.py
      - name: Generate phase-correct positive rank-r native compiler
        working-directory: research/p104-exact-clifford-factor-pass
        run: |
          python -I -B p104_minimal_symplectic.py
          python -I -B p104_exact_native_factor.py
          python -I -B p104_rank_r_native_recipes.py
      - name: Rebuild full Gram-half legacy comparator and no-new-clean-scratch word
        working-directory: research/p104-exact-clifford-factor-pass
        run: |
          python -I -B p104_complete_gram_channel_stdlib.py
          python -I -B p104_inplace_source.py
      - name: Independent 216-rational-input, frame, 46,656-dual and mutation verification
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_verify_inplace_source.py
      - name: All 104 genuine physical source ports, all 512 Gaussian columns
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_inplace_physical_source_ports.py
      - name: All 16 genuine E8 pivot children, all 512 Gaussian columns
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_inplace_pivot_native.py
      - name: Compile integer-only shared-denominator target channel
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_inplace_dyadic_target.py
      - name: Independent 216-integer-input and 46,656-dual proof
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_verify_inplace_dyadic.py
      - name: Compile fully typed integral I-minus-G-over-two side correction
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_inplace_side.py
      - name: Independent 216-column full side word, 46656 dual entries and mutants
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_verify_inplace_side.py
      - name: Exact all-prefix coefficient bound and 7-bit finite scalar guard
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_verify_inplace_prefix_guard.py
      - name: Construct chronological conjugate Delta inverse-transpose words
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_inplace_chrono_dual.py
      - name: Independent 216-variable ordinary inverse-transpose event proof
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_verify_inplace_chrono_dual.py
      - name: Exact all-column physical conjugate E8 pivot children
        working-directory: research/p104-exact-clifford-factor-pass
        run: python -I -B p104_inplace_pivot_delta_native.py
